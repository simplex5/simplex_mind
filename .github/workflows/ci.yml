# CI (SIMP-D2-025): pytest + ruff on both OS families in use, plus a live
# fresh-clone assertion — a bare checkout has no config.json/projects.yaml/DBs,
# which is exactly the state that bit the first external install (SIMP-D2-021).
name: CI
on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: ruff check .
      - run: pytest
      - name: doctor classifies a bare checkout as a fresh clone
        shell: bash
        run: |
          set +e
          out=$(simplex doctor)
          rc=$?
          echo "$out"
          if [ $rc -eq 0 ]; then
            echo "ERROR: doctor exited 0 on a bare checkout — degraded state went invisible"
            exit 1
          fi
          echo "$out" | grep -qi "fresh clone" || {
            echo "ERROR: doctor did not classify the bare checkout as a fresh clone"
            exit 1
          }
